<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="50%" stop-color="#7548E8" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#11152E"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#grad)" stroke-width="2.5" fill="none"/>
  <text x="32" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="900" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">D</text>
